[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextray"
version = "0.1.0"
description = "Character-level context optimizer: chunks chat histories with code-block protection, deduplicates exactly, and reports per-role token savings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "ContextRay contributors" },
]
keywords = ["llm", "context", "chunking", "deduplication", "tokens"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
contextray = "contextray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]